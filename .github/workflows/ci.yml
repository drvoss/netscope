name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: netscope-go
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: netscope-go/go.mod
          cache-dependency-path: netscope-go/go.sum
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vulnerability scan
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go build ./...

  cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux-release
          - os: windows-latest
            preset: windows-release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: db4723bd0a99eab031f1a3dee4336dca43049c87
          vcpkgJsonGlob: netscope-cpp/vcpkg.json
      - name: Configure
        if: runner.os == 'Linux'
        working-directory: netscope-cpp
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        if: runner.os == 'Linux'
        working-directory: netscope-cpp
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        if: runner.os == 'Linux'
        working-directory: netscope-cpp
        run: ctest --preset ${{ matrix.preset }}
      - name: Build and test with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-cpp.ps1 -Test
